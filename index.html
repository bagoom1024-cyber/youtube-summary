<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>내 유튜브 요약</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --ink:#1b1b1a; --muted:#6c6a66; --line:#e6e3dd;
  --accent:#d6402b; --accent-soft:#fbe9e5; --chip:#efece6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --surface:#1c1c1b; --ink:#ecebe8; --muted:#9c9a95; --line:#2c2b29;
  --accent:#ff6b55; --accent-soft:#3a1f1a; --chip:#262624;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:760px;margin:0 auto;padding:14px 16px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;letter-spacing:-.02em;white-space:nowrap}
h1 b{color:var(--accent)}
.updated{font-size:12px;color:var(--muted);white-space:nowrap}
.topr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.upd{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.upd:disabled{opacity:.5;cursor:default}
.upd .n{color:var(--accent)}
.search{margin-top:10px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:6px 12px;background:var(--chip);color:var(--ink);
  font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:26px 2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.row{display:flex;gap:14px;padding:14px;cursor:pointer}
.thumb{flex:none;width:132px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--chip);position:relative;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;
  background:rgba(0,0,0,.72);color:#fff}
.info{min-width:0;flex:1}
.ch{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{color:var(--accent);font-weight:700}
.title{font-size:15px;font-weight:700;margin:2px 0 6px;letter-spacing:-.01em;line-height:1.4}
.one{font-size:14px;color:var(--ink);opacity:.86;margin:0}
.more{padding:0 16px 16px;display:none}
.card.open .more{display:block}
.points{margin:0 0 14px;padding:12px 14px 12px 30px;background:var(--accent-soft);border-radius:12px;font-size:14px}
.points li{margin:3px 0}
.sum{font-size:15px}
.sum h3{font-size:15px;margin:18px 0 6px}
.sum p{margin:0 0 10px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.script{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);font-size:14.5px;line-height:1.75;
  white-space:pre-wrap;display:none}
.script.show{display:block}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.add .btn{flex:none;border-radius:12px}
.add .btn:disabled{opacity:.5;cursor:default}
.status{font-size:13px;margin-top:8px;color:var(--muted)}
.status.err{color:var(--accent)}
.status:empty{display:none}
.redo{display:none}
body.live .redo{display:inline-block}
.card.flash{outline:2px solid var(--accent);outline-offset:-1px}
@media (max-width:520px){
  .row{flex-direction:column;gap:10px;padding:12px}
  .thumb{width:100%}
  .title{font-size:16px}
}
</style>
</head>
<body>
<header><div class="head">
  <div class="top"><h1>내 유튜브 요약<b>.</b></h1>
    <div class="topr"><span class="updated" id="updated"></span><button class="upd" id="updBtn" hidden>↻ 새 영상 업데이트</button></div></div>
  <form class="add" id="add" hidden>
    <input id="addUrl" type="url" inputmode="url" placeholder="유튜브 링크 붙여넣기" required>
    <button class="btn primary" id="addBtn">요약</button>
  </form>
  <div class="status" id="status"></div>
  <input class="search" id="q" type="search" placeholder="제목·요약 검색">
  <div class="chips" id="chips"></div>
</div></header>
<main class="wrap" id="list"></main>

<script src="list.js"></script>
<script>
(function(){
  const V = window.VIDEOS || [], M = window.META || {};
  const $ = s => document.querySelector(s);
  const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let channel = "전체", query = "";
  $("#updated").textContent = M.updated ? "업데이트 " + M.updated : "";

  const channels = ["전체", ...new Set(V.map(v => v.channel).filter(Boolean))];
  $("#chips").innerHTML = channels.map(c => `<button class="chip${c==="전체"?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    channel = b.dataset.c;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  $("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

  function dayLabel(iso){
    if(!iso) return "직접 요청한 영상";
    const d = new Date(iso), t = new Date();
    const key = x => x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate();
    const y = new Date(t); y.setDate(t.getDate()-1);
    if(key(d)===key(t)) return "오늘";
    if(key(d)===key(y)) return "어제";
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
  }
  function md(text){
    let out = "", para = [];
    const flush = () => { if(para.length){ out += "<p>"+para.join("<br>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>"; para = []; } };
    for(const raw of esc(text).split("\n")){
      const line = raw.trim();
      if(!line){ flush(); continue; }
      const h = line.match(/^#{1,4}\s+(.*)$/);
      if(h){ flush(); out += "<h3>"+h[1]+"</h3>"; continue; }
      para.push(line);
    }
    flush();
    return out;
  }
  function card(v){
    return `<article class="card" data-id="${esc(v.id)}">
      <div class="row">
        <a class="thumb" href="${esc(v.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          <img loading="lazy" src="${esc(v.thumb)}" alt="">${v.short?'<span class="badge">Shorts</span>':""}
        </a>
        <div class="info">
          <div class="ch"><span>${esc(v.channel)}</span>${v.requested?'<span class="req">· 요청</span>':""}</div>
          <div class="title">${esc(v.title)}</div>
          <p class="one">${esc(v.one)}</p>
        </div>
      </div>
      <div class="more">
        ${v.points.length?`<ul class="points">${v.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
        <div class="sum">${md(v.summary)}</div>
        <div class="actions">
          ${v.script?`<button class="btn primary" data-script>전체 스크립트 보기</button>`:""}
          <a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">유튜브에서 보기</a>
          <button class="btn redo" data-redo>다시 요약</button>
        </div>
        <div class="script" id="s-${esc(v.id)}"></div>
        ${v.cut?'<div class="note">영상이 길어서 스크립트 뒷부분이 잘렸어요.</div>':""}
      </div>
    </article>`;
  }
  function render(){
    const list = V.filter(v => (channel==="전체" || v.channel===channel) &&
      (!query || (v.title+" "+v.one+" "+v.summary+" "+v.points.join(" ")).toLowerCase().includes(query)));
    if(!list.length){ $("#list").innerHTML = '<div class="empty">표시할 영상이 없어요.</div>'; return; }
    let html = "", last = null;
    for(const v of list){
      const d = dayLabel(v.published);
      if(d !== last){ html += `<div class="day">${d}</div>`; last = d; }
      html += card(v);
    }
    $("#list").innerHTML = html;
  }

  // 스크립트는 누를 때만 불러오기
  const waiting = {};
  window.__T = (id, text) => { const el = document.getElementById("s-"+id); if(el){ el.textContent = text; } (waiting[id]||[]).forEach(f=>f()); };
  $("#list").addEventListener("click", e => {
    const sb = e.target.closest("[data-script]");
    if(sb){
      const id = sb.closest(".card").dataset.id, box = document.getElementById("s-"+id);
      if(box.classList.contains("show")){ box.classList.remove("show"); sb.textContent="전체 스크립트 보기"; return; }
      box.classList.add("show"); sb.textContent = "스크립트 접기";
      if(!box.textContent){
        box.textContent = "불러오는 중…";
        const s = document.createElement("script"); s.src = "t/"+encodeURIComponent(id)+".js";
        s.onerror = () => box.textContent = "스크립트를 불러오지 못했어요.";
        document.body.appendChild(s);
      }
      return;
    }
    const rb = e.target.closest("[data-redo]");
    if(rb){ const v = V.find(x => x.id === rb.closest(".card").dataset.id); if(v && window.__redo) window.__redo(v); return; }
    if(e.target.closest("a")) return;
    const row = e.target.closest(".row");
    if(row) row.parentElement.classList.toggle("open");
  });
  render();

  // 방금 요약한 영상으로 이동
  function focusHash(){
    const id = decodeURIComponent(location.hash.slice(1)); if(!id) return;
    const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if(!el) return;
    el.classList.add("open","flash"); el.scrollIntoView({block:"start"}); window.scrollBy(0,-160);
  }
  focusHash();

  // 링크 넣어서 요약 (open_site.bat 으로 열었을 때만 동작)
  if(location.protocol.startsWith("http")){
    const form = $("#add"), input = $("#addUrl"), btn = $("#addBtn"), st = $("#status"), upd = $("#updBtn");
    form.hidden = false; upd.hidden = false; document.body.classList.add("live");
    if(M.pending) upd.innerHTML = `↻ 새 영상 업데이트 <span class="n">· 대기 ${M.pending}</span>`;
    const show = (msg, err) => { st.textContent = msg; st.classList.toggle("err", !!err); };
    const busy = b => { btn.disabled = b; input.disabled = b; upd.disabled = b; btn.textContent = b ? "요약 중" : "요약"; };
    async function poll(){
      try{
        const j = await (await fetch("api/status")).json();
        if(j.running){ show("⏳ " + j.line); setTimeout(poll, 2000); return; }
        busy(false);
        if(j.ok){
          show("✔ " + (j.message || "완료") + " — 불러오는 중…");
          if(j.id) location.hash = j.id; else history.replaceState(null, "", location.pathname);
          setTimeout(() => location.reload(), j.id ? 0 : 1200);
        }
        else show("✖ " + (j.message || "실패했어요."), true);
      }catch(e){ busy(false); show("✖ 서버와 연결이 끊겼어요. open_site.bat 창이 켜져 있는지 확인하세요.", true); }
    }
    form.addEventListener("submit", async e => {
      e.preventDefault();
      busy(true); show("⏳ 요청 중…");
      try{
        const r = await fetch("api/summarize", {method:"POST", headers:{"content-type":"application/json"},
          body: JSON.stringify({url: input.value})});
        const j = await r.json();
        if(!r.ok){
          busy(false); show("✖ " + j.error, true);
          if(j.id){ location.hash = j.id; focusHash(); }
          return;
        }
        input.value = ""; poll();
      }catch(err){ busy(false); show("✖ 서버에 연결할 수 없어요. open_site.bat 으로 열었는지 확인하세요.", true); }
    });
    window.__redo = async v => {
      if(!confirm(`"${v.title}"\n\n이 영상을 처음부터 다시 요약할까요? (사용량이 다시 들어요)`)) return;
      busy(true); show("⏳ 다시 요약 요청 중…"); window.scrollTo(0, 0);
      try{
        const r = await fetch("api/summarize", {method:"POST", headers:{"content-type":"application/json"},
          body: JSON.stringify({url: v.url, redo: true})});
        const j = await r.json();
        if(!r.ok){ busy(false); show("✖ " + j.error, true); return; }
        poll();
      }catch(e){ busy(false); show("✖ 서버에 연결할 수 없어요.", true); }
    };
    upd.addEventListener("click", async () => {
      busy(true); show("⏳ 새 영상 확인 중…");
      try{
        const r = await fetch("api/update", {method:"POST"}); const j = await r.json();
        if(!r.ok){ busy(false); show("✖ " + j.error, true); return; }
        poll();
      }catch(e){ busy(false); show("✖ 서버에 연결할 수 없어요. open_site.bat 으로 열었는지 확인하세요.", true); }
    });
    fetch("api/status").then(r=>r.json()).then(j=>{ if(j.running){ busy(true); poll(); } }).catch(()=>{});
  }
})();
</script>
</body>
</html>
